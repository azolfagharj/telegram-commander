telegram:
  bot_token: "YOUR_BOT_TOKEN"
  allowed_users:
    - "YOUR_USER_ID"

# Show a Run Command button that runs the next message as a shell command.
enable_run_command: true

menu:
  - name: System
    type: category
    icon: "🖥️"
    items:
      - name: Uptime & Load
        type: button
        icon: "🕒"
        function: command
        command: "uptime && uptime -p"
      - name: Disk Space (/)
        type: button
        icon: "💾"
        function: command
        command: "df -h /"
      - name: Memory Usage
        type: button
        icon: "🧮"
        function: command
        command: "free -h"
      - name: CPU Usage
        type: button
        icon: "🧠"
        function: command
        command: "top -bn1 | grep 'Cpu(s)'"
      - name: APT Updates
        type: button
        icon: "📦"
        function: command
        command: "apt update -qq"
      - name: APT Upgrades
        type: button
        icon: "📦"
        function: command
        command: "apt upgrade -y -qq"
  - name: Network
    type: category
    icon: "🌐"
    items:
      - name: Public IP
        type: button
        function: command
        command: "curl -sk ip4you.ir"
      - name: Listening Ports
        type: button
        icon: "🔌"
        function: command
        command: "ss -tulpn"
  - name: Echo
    type: button
    function: command
    command: "echo hello from telegram-commander"
