telegram:
  bot_token: "YOUR_BOT_TOKEN"
  allowed_users:
    - "YOUR_USER_ID"

menu:
  - name: System
    type: category
    items:
      - name: Uptime
        type: button
        function: command
        command: "uptime"
      - name: Disk usage
        type: button
        function: command
        command: "df -h"
  - name: Network
    type: category
    items:
      - name: Hostname
        type: button
        function: command
        command: "hostname"
      - name: Who am I
        type: button
        function: command
        command: "whoami"
  - name: Echo
    type: button
    function: command
    command: "echo hello from telegram-commander"
