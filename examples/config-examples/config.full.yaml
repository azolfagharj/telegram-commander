telegram:
  api: "https://api.telegram.org"
  bot_token: "0000000000:EXAMPLE_TOKEN_REPLACE_ME"
  allowed_users:
    - "123456789"
    - "admin_username"
  proxy:
    enabled: false
    url: "socks5://127.0.0.1:10808"
  insecure: false

function_directory: "examples/functions"

shell: "/bin/bash"
timeout: "60s"
max_output_bytes: 524288
menu_columns: 2
page_size: 8
confirm_ttl: "5m"
# Show a Run Command button that runs the next message as a shell command.
enable_run_command: true

logging:
  logs:
    default:
      level: info
      format: console
      output:
        - output: stderr
    audit:
      level: info
      format: json
      output:
        - output: stderr

menu:
  - name: "System"
    type: category
    icon: "🖥️"
    items:
      - name: "Resources"
        type: category
        icon: "📊"
        items:
          - name: "Uptime & Load"
            type: button
            icon: "🕒"
            function: command
            command: "uptime && uptime -p"
          - name: "Memory Usage"
            type: button
            icon: "🧮"
            function: command
            command: "free -h"
          - name: "CPU Usage"
            type: button
            icon: "🧠"
            function: command
            command: "top -bn1 | grep 'Cpu(s)'"
      - name: "Processes"
        type: category
        icon: "⚡"
        items:
          - name: "Top CPU Processes"
            type: button
            icon: "⚡"
            function: command
            command: "ps -eo pid,%cpu,%mem,comm --sort=-%cpu | head -15"
          - name: "Top I/O Processes"
            type: button
            icon: "🗃️"
            function: command
            command: "ps -eo pid,rbytes,wbytes,comm --no-headers | sort -k2,2nr -k3,3nr | head -15"
          - name: "Top Memory Processes"
            type: button
            icon: "🧮"
            function: command
            command: "ps -eo pid,%cpu,%mem,comm --sort=-%mem | head -15"
      - name: "Storage"
        type: category
        icon: "💾"
        items:
          - name: "Disk Space (/)"
            type: button
            icon: "💾"
            function: command
            command: "df -h /"
          - name: "LSBLK"
            type: button
            icon: "🧱"
            function: command
            command: "lsblk"
      - name: "APT"
        type: category
        icon: "📦"
        items:
          - name: "APT Updates"
            type: button
            icon: "📦"
            function: command
            command: "apt update -qq"
          - name: "APT Upgrades"
            type: button
            icon: "📦"
            function: command
            command: "apt upgrade -y -qq"
            confirm: true
      - name: "HostnameCTL"
        type: button
        icon: "🏷️"
        function: command
        command: "hostnamectl"
  - name: "Network"
    type: category
    icon: "🌐"
    items:
      - name: "Public IP"
        type: button
        icon: "📍"
        function: command
        command: "curl -sk ip4you.ir"
      - name: "Show resolv.conf"
        type: button
        icon: "🧭"
        function: command
        command: "grep -vE '^[[:space:]]*(#|$)' /etc/resolv.conf"
      - name: "Listening Ports"
        type: button
        icon: "🔌"
        function: command
        command: "ss -tulpn"
      - name: "Show /etc/hosts"
        type: button
        icon: "🗺️"
        function: command
        command: "grep -vE '^[[:space:]]*(#|$)' /etc/hosts"
      - name: "Network Interfaces"
        type: button
        icon: "🔗"
        function: command
        command: "ip -br addr"
      - name: "Neighbors"
        type: button
        icon: "🕸️"
        function: command
        command: "ip neigh"
      - name: "IP Routes"
        type: button
        icon: "🛣️"
        function: command
        command: "ip route"
  - name: "Echo"
    type: button
    function: command
    command: "echo hello from telegram-commander"
  - name: "MY_SCRIPT"
    type: category
    icon: "🛠️"
    items:
      - name: "Nginx"
        type: category
        icon: "🌐"
        items:
          - name: "Restart nginx"
            type: button
            icon: "🔄"
            function: command
            command: "systemctl restart nginx"
            confirm: true
          - name: "Stop nginx"
            type: button
            icon: "⛔"
            function: command
            command: "systemctl stop nginx"
            confirm: true
      - name: "Docker"
        type: category
        icon: "🐳"
        items:
          - name: "Restart Docker"
            type: button
            icon: "🔄"
            function: command
            command: "systemctl restart docker"
            confirm: true
  - name: "Restart SSH"
    type: button
    icon: "🔐"
    function: command
    command: "systemctl restart ssh"
    confirm: true
