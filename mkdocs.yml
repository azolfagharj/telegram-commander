site_name: Telegram Commander
site_description: Telegram bot that shows a button menu and runs host commands from a YAML config
site_author: azolfagharj
site_url: https://azolfagharj.github.io/telegram-commander/

repo_url: https://github.com/azolfagharj/telegram-commander
repo_name: azolfagharj/telegram-commander
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: statics

theme:
  name: mkdocs
  nav_style: dark

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Configuration: config-reference.md
  - Buttons and menus: buttons.md
  - Functions: functions-reference.md
  - CLI: cli-reference.md
  - Install and service: install.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
  - def_list

# site_url enables sitemap.xml for search engines
plugins:
  - search
