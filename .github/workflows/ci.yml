name: CI

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p release-binaries
          BINARY="telegram-commander-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -ldflags="-s -w" -o "release-binaries/${BINARY}" ./cmd/telegram-commander
          ls -lh release-binaries/

      - name: Verify binary (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./release-binaries/telegram-commander-linux-amd64 version

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-binaries/*
          retention-days: 1

  create-release:
    name: Create Release
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version and release date from main.go
        id: meta
        run: |
          VERSION=$(sed -n 's/^const version = "\(.*\)"/\1/p' cmd/telegram-commander/main.go)
          RELEASE_DATE=$(sed -n 's/^const releaseDate = "\(.*\)"/\1/p' cmd/telegram-commander/main.go)
          if [ -z "$VERSION" ] || [ -z "$RELEASE_DATE" ]; then
            echo "Failed to read version/releaseDate from main.go"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          echo "Release date: $RELEASE_DATE"

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: release-binaries-*
          path: release-binaries
          merge-multiple: true

      - name: Pack telegram-commander.tar.gz
        run: |
          ROOT=release-pack/telegram-commander
          mkdir -p "$ROOT/config-examples" "$ROOT/functions"
          cp release-binaries/telegram-commander-linux-amd64 "$ROOT/"
          cp release-binaries/telegram-commander-linux-arm64 "$ROOT/"
          cp examples/config-examples/config.minimal.yaml "$ROOT/config-examples/"
          sed 's|function_directory: "examples/functions"|function_directory: "./functions"|' \
            examples/config-examples/config.full.yaml > "$ROOT/config-examples/config.full.yaml"
          cp examples/functions/*.yaml "$ROOT/functions/"
          tar -C release-pack -czf telegram-commander.tar.gz telegram-commander
          tar -tzf telegram-commander.tar.gz
          ls -lh telegram-commander.tar.gz

      - name: Write release notes
        run: |
          {
            echo "## telegram-commander ${{ steps.meta.outputs.version }}"
            echo
            echo "- Version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Release date: \`${{ steps.meta.outputs.release_date }}\`"
            echo
            if [ -s CHANGELOG.md ]; then
              cat CHANGELOG.md
              echo
            fi
            cat <<'EOF'
          ### Assets

          | File | Contents |
          |------|----------|
          | `telegram-commander.tar.gz` | Folder `telegram-commander/` with linux-amd64 + linux-arm64 binaries, `config-examples/`, and `functions/` |
          | `telegram-commander-linux-amd64` | Linux amd64 binary |
          | `telegram-commander-linux-arm64` | Linux arm64 binary |
          EOF
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.version }}
          tag_name: ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: |
            telegram-commander.tar.gz
            release-binaries/telegram-commander-linux-amd64
            release-binaries/telegram-commander-linux-arm64
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear changelog after release
        run: |
          : > CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md already empty"
            exit 0
          fi
          git commit -m "chore: clear changelog after release [skip ci]"
          git push

