site_name: Telegram Commander
site_description: >-
  Telegram Commander is a free Linux bot that turns one YAML file into a button
  menu in Telegram. Tap a button to run a shell command on your server and read
  the output in the chat. No coding and no open ports.
site_author: azolfagharj
site_url: https://telecommander.ir/

repo_url: https://github.com/azolfagharj/telegram-commander
repo_name: GitHub
# No edit_uri: we only want the GitHub logo link, not per-page "Edit" links.
edit_uri: ""

copyright: 'Built by <a href="https://github.com/azolfagharj">azolfagharj</a> · <a href="https://github.com/azolfagharj/telegram-commander">Source on GitHub</a> · <a href="https://azolfagharj.github.io/donate/">Donate</a>'

# Page sources live in a sibling folder so mkdocs serve can watch them
# without also watching this config file.
docs_dir: markdown
site_dir: ../statics
use_directory_urls: true

theme:
  name: material
  # Only used to add structured data for search engines on the home page.
  custom_dir: overrides
  language: en
  icon:
    logo: simple/linux
    repo: fontawesome/brands/github
    admonition:
      note: material/note-text-outline
      info: material/information-outline
      tip: material/lightbulb-on-outline
      success: material/check-circle-outline
      warning: material/alert-outline
      example: material/code-braces
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    #- navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/azolfagharj/telegram-commander
      name: Source on GitHub
    - icon: fontawesome/solid/heart
      link: https://azolfagharj.github.io/donate/
      name: Donate

nav:
  - Home: index.md
  - Getting Started:
    - Installation:
        - Run in CLI: user-guide/installation/download-and-run.md
        - Run as a service: user-guide/installation/run-as-a-service.md  
    - Concepts:
        - Config file: user-guide/concepts/config-file.md
        - Menu: user-guide/concepts/menu.md
        - Button: user-guide/concepts/button.md
        - Category: user-guide/concepts/category.md
        - Function: user-guide/concepts/function.md
        - Parameter: user-guide/concepts/parameter.md
        - Shell: user-guide/concepts/shell.md
        - Allowed users: user-guide/concepts/allowed-users.md
        - Confirmation: user-guide/concepts/confirmation.md
        - How the bot connects: user-guide/concepts/long-polling.md
        - Audit log: user-guide/concepts/audit-log.md
    # The first entry is the section's own page, so "Functions" is clickable.
    # Groups below it are plain labels: no index page and no icon.
    - Functions:
        - user-guide/functions/index.md
        - Built-in:
            - command: user-guide/functions/built-in/command.md
            - script: user-guide/functions/built-in/script.md
        - Release pack:
            - Echo Script: user-guide/functions/release-pack/echo-script.md
            - Disk path: user-guide/functions/release-pack/disk-path.md
            - Curl URL: user-guide/functions/release-pack/curl-url.md
            - Ping Host: user-guide/functions/release-pack/ping-host.md
            - Journal Unit: user-guide/functions/release-pack/journal-unit.md
        - Write your own:
            - File structure: user-guide/functions/write-your-own/file-structure.md
            - Rules: user-guide/functions/write-your-own/rules.md
            - Placeholders: user-guide/functions/write-your-own/placeholders.md
            - Step by step guide: user-guide/functions/write-your-own/step-by-step.md
    - Reference:
        - Configuration: user-guide/configuration.md
        - CLI: user-guide/cli.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - meta
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# site_url enables sitemap.xml and canonical URLs
plugins:
  - search
  # auto_caption shows each image's alt text under the enlarged picture.
  - glightbox:
      auto_caption: true
  - redirects:
      redirect_maps:
        getting-started.md: user-guide/installation/download-and-run.md
        concepts.md: user-guide/concepts/config-file.md
        config-reference.md: user-guide/configuration.md
        buttons.md: user-guide/concepts/menu.md
        user-guide/buttons.md: user-guide/concepts/menu.md
        user-guide/menu.md: user-guide/concepts/menu.md
        # The old user-guide/functions.md page kept the URL /user-guide/functions/,
        # which the new user-guide/functions/index.md page now serves. No redirect
        # entry is added for it: a redirect there would replace the real page.
        functions-reference.md: user-guide/functions/index.md
        cli-reference.md: user-guide/cli.md
        install.md: user-guide/installation/run-as-a-service.md
