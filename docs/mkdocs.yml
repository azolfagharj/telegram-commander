site_name: Telegram Commander
site_description: >-
  Telegram Commander is a free Linux bot that turns one YAML file into a button
  menu in Telegram. Tap a button to run a shell command on your server and read
  the output in the chat. No coding and no open ports.
site_author: azolfagharj
site_url: https://telecommander.ir/

repo_url: https://github.com/azolfagharj/telegram-commander
repo_name: GitHub
# No edit_uri: we only want the GitHub logo link, not per-page "Edit" links.
edit_uri: ""

copyright: 'Built by <a href="https://github.com/azolfagharj">azolfagharj</a> · <a href="https://github.com/azolfagharj/telegram-commander">Source on GitHub</a> · <a href="https://azolfagharj.github.io/donate/">Donate</a>'

# Page sources live in a sibling folder so mkdocs serve can watch them
# without also watching this config file.
docs_dir: markdown
site_dir: ../statics
use_directory_urls: true

theme:
  name: material
  # Only used to add structured data for search engines on the home page.
  custom_dir: overrides
  language: en
  logo: images/logo.png
  favicon: images/favicon.png
  icon:
    alternate: material/translate
    repo: fontawesome/brands/github
    admonition:
      note: material/note-text-outline
      info: material/information-outline
      tip: material/lightbulb-on-outline
      success: material/check-circle-outline
      warning: material/alert-outline
      example: material/code-braces
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    #- navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - css/extra.css
  - css/persian.css

hooks:
  - hooks/language_sitemaps.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/azolfagharj/telegram-commander
      name: Source on GitHub
    - icon: fontawesome/solid/heart
      link: https://azolfagharj.github.io/donate/
      name: Donate

nav:
  - Home: index.md
  - Documentation:
    - Installation:
        - Run in CLI: documentation/installation/download-and-run.md
        - Run as a service: documentation/installation/run-as-a-service.md
    - Concepts:
        - Config file: documentation/concepts/config-file.md
        - Menu: documentation/concepts/menu.md
        - Button: documentation/concepts/button.md
        - Category: documentation/concepts/category.md
        - Function: documentation/concepts/function.md
        - Parameter: documentation/concepts/parameter.md
        - Shell: documentation/concepts/shell.md
        - Allowed users: documentation/concepts/allowed-users.md
        - Confirmation: documentation/concepts/confirmation.md
        - How the bot connects: documentation/concepts/long-polling.md
        - Audit log: documentation/concepts/audit-log.md
    # The first entry is the section's own page, so "Functions" is clickable.
    # Groups below it are plain labels: no index page and no icon.
    - Functions:
        - documentation/functions/index.md
        - Built-in:
            - command: documentation/functions/built-in/command.md
            - script: documentation/functions/built-in/script.md
        - Release pack:
            - Echo Script: documentation/functions/release-pack/echo-script.md
            - Disk path: documentation/functions/release-pack/disk-path.md
            - Curl URL: documentation/functions/release-pack/curl-url.md
            - Ping Host: documentation/functions/release-pack/ping-host.md
            - Journal Unit: documentation/functions/release-pack/journal-unit.md
        - Write your own:
            - File structure: documentation/functions/write-your-own/file-structure.md
            - Rules: documentation/functions/write-your-own/rules.md
            - Placeholders: documentation/functions/write-your-own/placeholders.md
            - Step by step guide: documentation/functions/write-your-own/step-by-step.md
    - Reference:
        - Configuration: documentation/configuration.md
        - CLI: documentation/cli.md
  - Contribute: contribute.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - meta
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

