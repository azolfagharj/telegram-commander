{% extends "base.html" %}

<!-- Structured data for search engines. Home page only. -->
{% block extrahead %}
  {{ super() }}
  {% if page and page.is_homepage %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "{{ config.site_url }}#website",
            "url": "{{ config.site_url }}",
            "name": "Telegram Commander",
            "description": {{ config.site_description | tojson }},
            "inLanguage": "{{ config.theme.language }}",
            "publisher": {
              "@id": "{{ config.site_url }}#author"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "{{ config.site_url }}#software",
            "name": "Telegram Commander",
            "url": "{{ config.site_url }}",
            "description": {{ page.meta.description | default(config.site_description) | tojson }},
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Linux",
            "inLanguage": "{{ config.theme.language }}",
            "isAccessibleForFree": true,
            "codeRepository": "{{ config.repo_url }}",
            "downloadUrl": "{{ config.repo_url }}/releases/latest",
            "softwareHelp": {
              "@type": "WebPage",
              "url": "{{ config.site_url }}documentation/installation/download-and-run/"
            },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "author": {
              "@type": "Person",
              "@id": "{{ config.site_url }}#author",
              "name": "azolfagharj",
              "url": "https://github.com/azolfagharj"
            }
          }
        ]
      }
    </script>
  {% endif %}
{% endblock %}
